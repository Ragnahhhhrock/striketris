<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrikeTris characters</title>
<meta name="description" content="Lineup of every StrikeTris fighter with all animations.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="design/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--well-900); color: var(--ink); font: var(--text-md)/1.45 var(--font); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { position: fixed; top: 14px; left: 14px; width: 260px; background: var(--panel); padding: 12px 16px; text-shadow: var(--shadow-text); }
  .panel h1 { margin: 0 0 8px; font-size: var(--text-lg); }
  .panel label { display: block; margin: 8px 0 2px; color: var(--ink-dim); font-size: var(--text-sm); }
  .panel select, .panel input[type=range] { width: 100%; background: var(--well-700); color: var(--ink); border: 1px solid var(--line); padding: 6px; font: inherit; border-radius: 0; }
  .panel input[type=range] { padding: 0; }
  .panel button { margin: 8px 6px 0 0; background: var(--well-500); color: var(--ink); border: 0; padding: 6px 12px; font: inherit; cursor: pointer; border-radius: 0; }
  .panel button:hover { background: var(--well-400); }
  .panel :focus-visible { outline: var(--focus); outline-offset: 2px; }
  #info { margin-top: 10px; min-height: 66px; color: var(--ink-dim); font-size: var(--text-sm); }
  #info b { color: var(--gold); font-size: var(--text-md); }
  .tag { position: fixed; transform: translate(-50%, 0); pointer-events: auto; cursor: pointer; background: var(--panel); padding: 1px 8px; font-size: var(--text-sm); text-shadow: var(--shadow-text); white-space: nowrap; }
  .tag.att { border-bottom: 3px solid var(--attackers); }
  .tag.def { border-bottom: 3px solid var(--defenders); }
  .tag.sel { color: var(--gold); }
  #help { position: fixed; bottom: 14px; left: 14px; color: var(--ink-faint); font-size: var(--text-sm); text-shadow: var(--shadow-text); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel">
  <h1>StrikeTris characters</h1>
  <label for="anim">Animation</label>
  <select id="anim"></select>
  <label for="gun">Weapon</label>
  <select id="gun"><option value="main">Primary</option><option value="side">Sidearm</option></select>
  <label for="cls">Class</label>
  <select id="cls"></select>
  <label for="pitch">Look up and down</label>
  <input id="pitch" type="range" min="-1" max="1" step="0.05" value="0">
  <label><input id="bomb" type="checkbox"> Carrying the bomb</label>
  <label><input id="spin" type="checkbox" checked> Turntable</label>
  <button id="front">Front</button><button id="back">Back</button><button id="all">Everyone</button>
  <div id="info"></div>
</div>
<div id="tags"></div>
<div id="help">Drag to orbit, wheel to zoom, click a name to focus. Back to <a href="./" style="color:var(--gold)">the game</a>.</div>
<script type="module" src="src/characterView.js"></script>
</body>
</html>
